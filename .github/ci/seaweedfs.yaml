---
apiVersion: v1
kind: Namespace
metadata:
  name: storage-test
---
apiVersion: v1
kind: LimitRange
metadata:
  name: storage-test
  namespace: storage-test
spec:
  limits:
    - type: Container
      max:
        cpu: "1"
        memory: 1Gi
    - type: PersistentVolumeClaim
      max:
        storage: 1Gi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: storage-test
  namespace: storage-test
spec:
  hard:
    pods: "2"
    requests.cpu: 200m
    requests.memory: 512Mi
    limits.cpu: "2"
    limits.memory: 2Gi
    persistentvolumeclaims: "1"
    requests.storage: 1Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: seaweedfs-s3
  namespace: storage-test
type: Opaque
stringData:
  # Fixed credentials for isolated Helm CI only.
  s3.json: |
    {
      "identities": [
        {
          "name": "irs-ci-test-only",
          "credentials": [
            {
              "accessKey": "irs-ci-access",
              "secretKey": "irs-ci-secret-key"
            }
          ],
          "actions": ["Admin", "Read", "List", "Write"]
        }
      ]
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seaweedfs-data
  namespace: storage-test
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
  namespace: storage-test
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: seaweedfs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seaweedfs
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 3000
        fsGroup: 3000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:4.52@sha256:57877e32bb90073b37dc109b438ba66e84fd5ed9ced5f5c04f56444ef243ce59
          workingDir: /data
          args:
            - server
            - -s3
            - -dir=/data
            - -s3.port=8333
            - -s3.config=/etc/seaweedfs/s3.json
            - -master.volumeSizeLimitMB=64
            - -volume.max=0
            - -master.telemetry=false
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: s3
              containerPort: 8333
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: s3
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: s3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: s3
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            - name: s3-config
              mountPath: /etc/seaweedfs
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: seaweedfs-data
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: s3-config
          secret:
            secretName: seaweedfs-s3
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  namespace: storage-test
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: seaweedfs
  ports:
    - name: s3
      port: 8333
      targetPort: s3
      protocol: TCP
