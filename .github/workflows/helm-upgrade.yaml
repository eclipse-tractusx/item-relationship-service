name: Upgrade Charts

on:
  pull_request:
    paths:
      - 'charts/item-relationship-service/**'
      - '.github/ci/**'
      - '.github/workflows/helm-upgrade.yaml'
  workflow_dispatch:

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Kubernetes KinD Cluster
        uses: container-tools/kind-action@0ad70e2299366b0e1552c7240f4e4567148f723e # v2.0.4

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.9.3

      - name: Add repos
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo add minio https://charts.min.io/
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo add irs https://eclipse-tractusx.github.io/item-relationship-service

      - name: Set up test storage
        run: |
          kubectl apply -f .github/ci/seaweedfs.yaml
          kubectl rollout status deployment/seaweedfs -n storage-test --timeout=180s

      - name: Run helm install
        # Install latest released item-relationship-service version
        run: |
          helm install irs irs/item-relationship-service --set bpn=BPNL000000000000 \
            --values .github/ci/seaweedfs-values.yaml --wait

      - name: Verify installed chart
        run: |
          helm test irs
          bash .github/ci/check-seaweedfs.sh prepare

      - name: Run helm upgrade
        # Upgrade the installed item-relationship-service version with the locally available charts
        run: |
          helm dependency update charts/item-relationship-service
          helm upgrade irs charts/item-relationship-service --set bpn=BPNL000000000000 \
            --values .github/ci/seaweedfs-values.yaml --wait

      - name: Verify upgraded chart and stored data
        run: |
          helm test irs
          bash .github/ci/check-seaweedfs.sh verify
