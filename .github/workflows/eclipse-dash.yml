name: "Eclipse DASH IP Check"

on:
  workflow_dispatch: # Trigger manually
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
  pull_request:
    branches:
      - main
    paths:
      - '**/pom.xml'
      - 'pom.xml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build with Maven and check dependencies with dash
        run: |
          mvn --batch-mode --update-snapshots verify -P dash

      - name: Ensure DEPENDENCIES file is reflecting the current state
        run: |
          for attempt in 1 2 3; do
            rm -f DEPENDENCIES-gen
            if mvn --batch-mode org.eclipse.dash:license-tool-plugin:license-check -Ddash.summary=DEPENDENCIES-gen -P dash; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 15))
          done
          diff DEPENDENCIES DEPENDENCIES-gen


      - name: upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          path: 'target/dash/summary'
